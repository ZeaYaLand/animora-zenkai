<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ANIMORA — переход к плееру</title>
  <script>
    (function () {
      "use strict";
      // Keep every playback parameter from the existing app/player launch URL.
      // This makes the new player the default without rewriting source integrations.
      var target = new URL("/player/v2.html", location.origin);
      target.search = location.search;
      target.hash = location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Открываем плеер ANIMORA…</p>
  <noscript><a href="/player/v2.html">Открыть новый плеер ANIMORA</a></noscript>
</body>
</html>
