name: ANIMORA player regression

on:
  push:
    branches:
      - "animora/brand-adaptation"
  pull_request:
    branches:
      - main
    paths:
      - "player/**"
      - "api/animego/**"
      - "scripts/test-animego-adapter.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/animego-player-tests.yml"

jobs:
  player-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Russian player adapters
        run: npm run test:animego
      - name: Build static site
        run: npm run build
      - name: Verify generated site
        run: npm run build:verify
